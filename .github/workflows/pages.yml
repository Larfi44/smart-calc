name: Deploy to GitVerse Pages

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build:pages

      - name: Deploy to pages/main
        run: |
          git config --global user.name "gitverse-actions"
          git config --global user.email "gitverse-actions@gitverse.local"
          git checkout --orphan pages/main
          git rm -rf .
          cp -r out/* .
          echo "out" >> .gitignore
          git add -A
          git commit -m "Deploy $(git rev-parse --short HEAD) to pages/main" || echo "No changes"
          git push -f origin pages/main
